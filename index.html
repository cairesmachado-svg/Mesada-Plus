    <div class="card"><div class="list">${state.bonuses.filter(b=>b.month===m&&viewChildren().some(c=>c.id===b.childId)).sort((a,b)=>b.date.localeCompare(a.date)).map(b=>`<div class="list-row"><div class="event-ico bg-good good">${icon('stars')}</div><div class="list-main"><div class="list-name">${esc(TASKS.find(t=>t.id===b.taskId)?.name||'Bônus')}</div><div class="list-meta">${esc(getChild(b.childId).name)} · Ciclo ${b.week+1} · ${fmtD(b.date)}</div></div><b class="good">+ ${money(b.amount)}</b></div>`).join('')||'<div class="empty">Nenhum bônus aprovado até agora.</div>'}</div></div>`;
  }
  function renderWallet(){const c=currentChild(),f=finances(c.id),available=wallet(c.id),savings=savedTotal(c.id),goals=state.goals.filter(g=>g.childId===c.id),ledger=state.ledger.filter(l=>l.childId===c.id).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);return `${header('EDUCAÇÃO FINANCEIRA','Meu dinheiro, minhas escolhas','Acompanhe o saldo virtual, planeje compras e separe valores para metas.')}${selectedChildPicker()}
    <div class="grid two" style="margin-top:20px"><div class="mini-balance"><div class="muted">SALDO LIVRE EM CONTA VIRTUAL</div><div class="balance-number">${money(available)}</div><div class="balance-row"><span>${esc(c.name)} · Dados fictícios</span><span>Sem banco conectado</span></div></div><div class="card"><div class="small-label">RESUMO FINANCEIRO</div><div class="list"><div class="list-row"><div class="list-main"><div class="list-name">Poupança em metas</div><div class="list-meta">Dinheiro reservado virtualmente</div></div><b class="good">${money(savings)}</b></div><div class="list-row"><div class="list-main"><div class="list-name">Mesada prevista no mês</div><div class="list-meta">Ainda não adicionada ao saldo</div></div><b class="purple">${money(f.total)}</b></div><div class="list-row"><div class="list-main"><div class="list-name">Saldo total já registrado</div><div class="list-meta">Disponível + reservado</div></div><b>${money(available+savings)}</b></div></div></div></div>
    ${sec('Meus cofrinhos','Poupar é dar tempo aos sonhos.',isParent()?`<button class="btn" data-act="modal-goal">${icon('plus')} Criar meta</button>`:'')}
    <div class="grid two">${goals.map(g=>{const actual=savedForGoal(g.id);return `<div class="card goal-card"><div class="goal-top"><span class="goal-emoji">${esc(g.emoji)}</span><span class="pill justified">${Math.round(actual/g.target*100)}% da meta</span></div><div><div class="list-name" style="font-size:15px">${esc(g.name)}</div><div class="goal-value">${money(actual)} <small>de ${money(g.target)}</small></div></div><div class="bar" style="margin:0"><span style="width:${Math.min(100,actual/g.target*100)}%"></span></div><div class="goal-bottom">${isParent()?`<button class="btn soft" data-act="modal-save" data-goal="${g.id}">+ Guardar</button><button class="btn secondary" data-act="modal-unsave" data-goal="${g.id}">Resgatar</button>`:`<div class="goal-note">Peça ao responsável para transferir valores para esta meta.</div>`}</div></div>`;}).join('')||'<div class="card empty">Ainda não há metas cadastradas.</div>'}</div>
    ${sec('Movimentações recentes','Todos os lançamentos ficam no histórico.',isParent()?`<button class="btn secondary small" data-act="modal-spend">${icon('coin')} Registrar gasto</button>`:'')}
    <div class="card"><div class="list">${ledger.map(x=>{const credit=['opening','payout','unsave'].includes(x.type);return `<div class="list-row"><div class="event-ico ${credit?'bg-good good':'bg-purple purple'}">${icon(credit?'coin':'wallet')}</div><div class="list-main"><div class="list-name">${esc(x.description)}</div><div class="list-meta">${fmtD(x.date)} · ${x.type==='save'?'Transferência interna para meta':x.type==='unsave'?'Retorno da meta ao saldo':x.type==='spend'?'Saída de dinheiro virtual':'Entrada de saldo virtual'}</div></div><b class="${credit?'good':'purple'}">${credit?'+':'−'}${money(x.amount)}</b></div>`;}).join('')||'<div class="empty">Sem transações registradas.</div>'}</div></div>
    ${isParent()?`<div class="hint-box" style="margin-top:20px"><b>Fechamento:</b> a mesada prevista só é transferida para o saldo disponível após o responsável encerrar o mês. ${monthClosed(c.id)?'Este mês já foi encerrado para este perfil.':`<button class="btn soft small" style="margin-left:8px" data-act="close-month">${icon('lock')} Encerrar mês demonstrativo</button>`}</div>`:''}`;
  }
  function renderRules(){const c=state.config;return `${header('REGULAMENTO FAMILIAR','Os combinados da casa','Regras claras fazem a educação financeira ser previsível e justa.')}
    <div class="grid two sm-stack"><div class="card"><h2 class="section-title" style="margin-bottom:7px">Parâmetros mensais</h2><p class="section-hint">Os valores abaixo afetam somente ciclos não encerrados neste protótipo.</p><form id="settings" style="margin-top:20px"><div class="rules-grid">${[['base','Mesada-base (R$)'],['maxDeduction','Desconto máximo (R$)'],['maxBonus','Bônus máximo (R$)'],['maxRecovery','Recuperação máxima (R$)']].map(([k,l])=>`<div class="rule-field"><label for="cfg-${k}">${l}</label><input id="cfg-${k}" name="${k}" type="number" min="0" max="999" step="1" value="${Math.round(c[k]/100)}" ${isParent()?'':'disabled'} /></div>`).join('')}</div>${isParent()?`<div class="form-actions"><button class="btn" type="submit">Salvar regras</button></div>`:''}</form></div>
    <div class="card"><h2 class="section-title" style="margin-bottom:15px">Princípios educativos</h2><div class="list">${[['shield','Sem punição automática','Todo registro escolar deve ser analisado pelos responsáveis.'],['coin','Saldo já recebido é protegido','Uma nova ocorrência não confisca dinheiro já consolidado.'],['stars','Hábitos positivos','A constância vale mais que uma tarefa isolada.'],['school','Correção é possível','Ocorrências leves admitem recuperação parcial após reparação.']].map(([i,t,d])=>`<div class="list-row"><div class="event-ico bg-purple purple">${icon(i)}</div><div class="list-main"><div class="list-name">${t}</div><div class="list-meta">${d}</div></div></div>`).join('')}</div></div></div>
    ${sec('Perfis e idades','As idades iniciais são exemplos editáveis. Não há dados reais conectados.',isParent()?`<button class="btn secondary small" data-act="modal-child">${icon('plus')} Novo perfil</button>`:'')}
    <div class="grid two">${viewChildren().map(p=>`<div class="card tight"><div class="child-head" style="margin-bottom:0"><div class="avatar" style="background:${p.bg};color:${p.color}">${esc(p.name.slice(0,1).toUpperCase())}</div><div class="list-main"><div class="child-name">${esc(p.name)}</div><div class="child-age">${p.age} anos</div></div>${isParent()?`<button class="btn secondary small" data-act="modal-edit-child" data-id="${p.id}">${icon('edit')} Editar</button>`:''}</div></div>`).join('')}</div>
    ${sec('Testes e demonstração','Este protótipo usa dados fictícios guardados localmente.')}
    <div class="card"><div class="teacher-note"><b>Atenção:</b> GitHub Pages publica arquivos estáticos. Esta demonstração salva dados no navegador, sem login, banco de dados ou isolamento real por criança. Não a utilize como sistema de produção com informações pessoais ou escolares até integrar um backend seguro.</div>${isParent()?`<div class="form-actions"><button class="btn secondary" data-act="reset-demo">${icon('alert')} Restaurar dados fictícios</button></div>`:''}</div>`;}
  function shellModal(title,description,body,submitLabel='Salvar',formId='modal-form'){
    modalHTML=`<div class="modal-backdrop" data-act="close-modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><button class="modal-close" type="button" data-act="close-modal" aria-label="Fechar">×</button><h2>${esc(title)}</h2><p>${esc(description)}</p><form id="${formId}">${body}<div class="form-actions"><button type="button" class="btn secondary" data-act="close-modal">Cancelar</button><button class="btn" type="submit">${submitLabel}</button></div></form></section></div>`;render();document.querySelector('.modal input:not([type=hidden]),.modal select,.modal textarea')?.focus();
  }
  const input=(name,label,opts='')=>`<div class="form-field"><label for="fm-${name}">${label}</label><input id="fm-${name}" name="${name}" ${opts} required /></div>`;
  const choices=()=>state.children.map(c=>`<option value="${c.id}" ${c.id===state.selected?'selected':''}>${esc(c.name)}</option>`).join('');
  function openModal(which,id=''){
    if(!isParent())return notify('Esta ação exige acesso de responsável.');
    if(which==='occurrence'){
      if(monthClosed(state.selected))return notify('Este mês está fechado para este perfil.');
      shellModal('Registrar ocorrência','O lançamento ficará pendente até aprovação explícita.',`<div class="form-field"><label for="fm-child">Filha</label><select id="fm-child" name="child" required>${choices()}</select></div><div class="form-field"><label for="fm-kind">Tipo de ocorrência</label><select id="fm-kind" name="kind">${KINDS.map(k=>`<option value="${k.id}">${esc(k.title)} · −${money(k.points*200)}</option>`).join('')}</select></div>${input('date','Data',`type="date" min="${activeMonth}-01" max="${today()}" value="${today()}"`)}<div class="form-field"><label for="fm-detail">Descrição (opcional)</label><textarea id="fm-detail" name="detail" placeholder="Ex.: Livro de geografia esquecido"></textarea></div>`,'Registrar pendente','form-occurrence');
    } else if(which==='child'){
      shellModal('Adicionar perfil','Os nomes e idades podem ser ajustados depois.',`${input('name','Nome',`type="text" maxlength="25" placeholder="Nome"`)}${input('age','Idade',`type="number" min="6" max="19" value="12"`)}`,'Adicionar','form-child');
    } else if(which==='edit-child'){
      const c=getChild(id);shellModal('Editar perfil',`Altere os dados de ${c.name}.`, `<input type="hidden" name="id" value="${c.id}" />${input('name','Nome',`type="text" maxlength="25" value="${esc(c.name)}"`)}${input('age','Idade',`type="number" min="6" max="19" value="${c.age}"`)}`,'Salvar','form-edit-child');
    } else if(which==='goal'){
      shellModal('Nova meta de poupança','O cofrinho é virtual e não movimenta uma conta bancária.',`<div class="form-field"><label>Filha</label><select name="child">${choices()}</select></div>${input('name','O que deseja comprar?',`type="text" maxlength="38" placeholder="Ex.: Bicicleta"`)}${input('amount','Valor da meta (R$)',`type="number" min="1" max="100000" step="0.01" value="150"`)}<div class="form-field"><label>Ícone</label><select name="emoji"><option value="🎯">🎯 Meta</option><option value="📚">📚 Livros</option><option value="🚲">🚲 Bicicleta</option><option value="🎧">🎧 Fone</option><option value="🎮">🎮 Jogo</option><option value="🎡">🎡 Passeio</option></select></div>`,'Criar meta','form-goal');
    } else if(which==='save'||which==='unsave'){
      const g=state.goals.find(g=>g.id===id);if(!g)return;const max=which==='save'?wallet(g.childId):savedForGoal(g.id);
      shellModal(which==='save'?'Guardar dinheiro':'Resgatar dinheiro',`${esc(g.name)} · máximo disponível ${money(max)}.`,`<input type="hidden" name="goal" value="${g.id}" />${input('amount','Valor em reais',`type="number" min="0.01" max="${(max/100).toFixed(2)}" step="0.01" value="${(Math.min(1000,max)/100).toFixed(2)}"`)}`,'Confirmar',which==='save'?'form-save':'form-unsave');
    } else if(which==='spend'){
      const c=currentChild();shellModal('Registrar gasto',`Saldo disponível de ${c.name}: ${money(wallet(c.id))}.`,`<input type="hidden" name="child" value="${c.id}" />${input('amount','Valor em reais',`type="number" min="0.01" max="${(wallet(c.id)/100).toFixed(2)}" step="0.01" value="5"`)}${input('description','Descrição',`type="text" maxlength="70" placeholder="Ex.: Lanche"`)}`,'Registrar gasto','form-spend');
    }
  }
  function notify(message){let t=document.querySelector('#toast');if(!t)return; t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3400);}
  function closeModal(){modalHTML='';render();}
  function canChange(cid,m=activeMonth){return isParent()&&!monthClosed(cid,m);}
  function dayToggle(childId,taskId,d){if(!canChange(childId))return notify('Apenas o responsável pode registrar tarefas de meses abertos.');if(d>today()||!byMonth(d,activeMonth))return notify('Selecione uma data válida, não futura.');const w=activeWeek;if(state.bonuses.some(b=>b.childId===childId&&b.taskId===taskId&&b.month===activeMonth&&b.week===w))return notify('Este bônus já foi aprovado e os registros foram consolidados.');const idx=state.checkins.findIndex(i=>i.childId===childId&&i.taskId===taskId&&i.date===d);if(idx>=0)state.checkins.splice(idx,1);else state.checkins.push({id:uid(),childId,taskId,week:w,month:activeMonth,date:d});save();render();}
  function grantBonus(cid,taskId){if(!canChange(cid))return;const t=TASKS.find(t=>t.id===taskId);if(!t)return;const w=activeWeek,m=activeMonth;const key=b=>b.childId===cid&&b.taskId===taskId&&b.week===w&&b.month===m;if(state.bonuses.some(key))return notify('Este bônus já foi aprovado.');const completed=new Set(state.checkins.filter(i=>i.childId===cid&&i.taskId===taskId&&i.week===w&&i.month===m).map(i=>i.date)).size;if(completed<t.target)return notify('A meta de dias ainda não foi alcançada.');const total=state.bonuses.filter(b=>b.childId===cid&&b.month===m).reduce((a,b)=>a+b.amount,0);if(total+t.value>state.config.maxBonus)return notify('Este bônus ultrapassa o limite mensal.');state.bonuses.push({id:uid(),childId:cid,taskId,week:w,month:m,amount:t.value,date:today()});save();render();notify(`Bônus de ${money(t.value)} aprovado para ${getChild(cid).name}!`);}
  function reviewEvent(id,newStatus){const o=state.occurrences.find(x=>x.id===id);if(!o||!canChange(o.childId,o.date.slice(0,7)))return notify('Ocorrência indisponível para alteração.');o.status=newStatus;o.recovered=false;save();render();notify(newStatus==='confirmed'?'Ocorrência confirmada e aplicada à projeção.':'Registro abonado ou devolvido para análise.');}
  function recoverEvent(id){const o=state.occurrences.find(x=>x.id===id);if(!o||!canChange(o.childId,o.date.slice(0,7))||o.status!=='confirmed'||o.recovered)return;const k=KINDS.find(k=>k.id===o.kind);if(!k||k.points>3)return notify('A recuperação monetária se aplica apenas aos níveis 1 a 3.');if(!confirm('Confirmar a medida corretiva? Isso recuperará até 50% da ocorrência, respeitando o teto mensal.'))return;const f=finances(o.childId,o.date.slice(0,7));if(f.recovered>=state.config.maxRecovery)return notify('O teto mensal de recuperação já foi atingido.');o.recovered=true;save();render();notify('Recuperação parcial registrada.');}
  function closeMonth(cid){if(!isParent()||monthClosed(cid))return;const f=finances(cid);if(!confirm(`Encerrar ${monthLabel(activeMonth)} para ${getChild(cid).name} e creditar ${money(f.total)} à conta virtual? Esta ação é irreversível nesta demonstração.`))return;
    state.closures.push({id:uid(),childId:cid,month:activeMonth,...f,closedAt:today()});state.ledger.push({id:uid(),childId:cid,type:'payout',amount:f.total,date:today(),description:`Mesada consolidada de ${monthLabel(activeMonth)}`});save();render();notify('Mesada consolidada uma única vez.');}
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
    if(a==='close-modal-bg'){if(e.target===b)closeModal();return;}
    if(a==='close-modal'){closeModal();return;}
    if(a==='nav'){state.view=b.dataset.view;save();render();window.scrollTo(0,0);return;}
    if(a==='child'){if(!isParent()&&state.role!==`child:${b.dataset.child}`)return;state.selected=b.dataset.child;save();render();return;}
    if(a==='week'){activeWeek=Number(b.dataset.week);render();return;}
    if(a.startsWith('modal-')){const type=a.slice(6);openModal(type,b.dataset.id||b.dataset.goal);return;}
    if(a==='checkin'){dayToggle(state.selected,b.dataset.task,b.dataset.day);return;}
    if(a==='grant-bonus'){grantBonus(state.selected,b.dataset.task);return;}
    if(a==='approve'||a==='excuse'||a==='review'){reviewEvent(b.dataset.id,a==='approve'?'confirmed':a==='excuse'?'justified':'pending');return;}
    if(a==='recover'){recoverEvent(b.dataset.id);return;}
    if(a==='close-month'){closeMonth(state.selected);return;}
    if(a==='reset-demo'){if(!isParent())return;if(confirm('Restaurar os dados fictícios? Isso apagará todas as alterações salvas neste navegador.')){state=seed();activeWeek=thisCycle();activeMonth=period();save();render();notify('Demonstração restaurada.');}return;}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalHTML)closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('child-card')){e.preventDefault();e.target.click();}});
  document.addEventListener('change',e=>{if(e.target.id==='role'){state.role=e.target.value;if(!isParent())state.selected=state.role.slice(6);save();render();}});
  document.addEventListener('submit',e=>{
    const form=e.target;if(!form.id)return;e.preventDefault();const data=Object.fromEntries(new FormData(form));const cents=x=>Math.round(Number(x)*100);
    if(form.id==='settings'){
      if(!isParent())return;for(const k of Object.keys(state.config))state.config[k]=number(cents(data[k]),0,99900);save();render();notify('Regras salvas para o mês ainda aberto.');return;
    }
    if(!isParent())return;
    if(form.id==='form-occurrence'){
      if(!canChange(data.child))return notify('O mês deste perfil está encerrado.');if(!byMonth(data.date,activeMonth)||data.date>today())return notify('Data inválida: use uma data deste mês até hoje.');if(!KINDS.some(t=>t.id===data.kind))return;
      state.occurrences.push({id:uid(),childId:data.child,kind:data.kind,date:data.date,detail:(data.detail||'').trim().slice(0,300),status:'pending',recovered:false});save();closeModal();notify('Ocorrência registrada, aguardando aprovação.');return;
    }
    if(form.id==='form-child'||form.id==='form-edit-child'){
      const name=String(data.name||'').trim().slice(0,25),age=number(data.age,6,19);if(!name)return;
      if(form.id==='form-child'){const palette=[['#dc8a51','#fff0e5'],['#1c80ba','#e8f4fe'],['#8056d9','#f0eaff']];const [color,bg]=palette[state.children.length%palette.length];const id=uid();state.children.push({id,name,age,color,bg});state.selected=id;state.role='parent';}
      else {const p=getChild(data.id);if(!p)return;p.name=name;p.age=age;}
      save();closeModal();notify('Perfil salvo com sucesso.');return;
    }
    if(form.id==='form-goal'){
      const amount=cents(data.amount);if(amount<100||amount>10000000)return notify('Informe uma meta válida.');state.goals.push({id:uid(),childId:data.child,name:String(data.name||'').trim().slice(0,38),emoji:data.emoji,target:amount});state.selected=data.child;save();closeModal();notify('Novo cofrinho criado.');return;
    }
    if(form.id==='form-save'||form.id==='form-unsave'){
      const goal=state.goals.find(g=>g.id===data.goal);if(!goal)return;const amount=cents(data.amount);const isSave=form.id==='form-save';const available=isSave?wallet(goal.childId):savedForGoal(goal.id);if(!Number.isSafeInteger(amount)||amount<=0||amount>available)return notify('Saldo insuficiente ou valor inválido.');state.ledger.push({id:uid(),childId:goal.childId,goalId:goal.id,type:isSave?'save':'unsave',amount,date:today(),description:isSave?`Reserva para ${goal.name}`:`Resgate da meta ${goal.name}`});save();closeModal();notify(isSave?'Dinheiro reservado no cofrinho.':'Valor devolvido ao saldo disponível.');return;
    }
    if(form.id==='form-spend'){
      const amount=cents(data.amount),cid=data.child;if(!Number.isSafeInteger(amount)||amount<=0||amount>wallet(cid))return notify('Saldo insuficiente ou valor inválido.');const desc=String(data.description||'').trim().slice(0,70);if(!desc)return notify('Informe a descrição.');state.ledger.push({id:uid(),childId:cid,type:'spend',amount,date:today(),description:desc});save();closeModal();notify('Gasto registrado na conta virtual.');return;
    }
  });
  render();
  /* Sem service worker: este arquivo é 100% independente. */
})();

  </script>
</body>
</html>
